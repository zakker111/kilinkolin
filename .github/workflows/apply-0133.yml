name: Apply 0.13.3 student locations

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the tested 0.13.3 source patch
        run: python3 .github/apply-0133.py
      - name: Build with the new student locations
        run: python3 scripts/build.py --city tampere --mode full
      - name: Fetch the new venue legs
        run: python3 scripts/routes.py --max 300
      - name: Rebuild with the new geometry
        run: python3 scripts/build.py --city tampere --mode full
      - name: Validate
        run: python3 scripts/validate.py
      - name: Commit 0.13.3 and remove the one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/feeds/kide.py scripts/build.py web/config.js README.md NOTICE.md TODO.md AGENTS.md VERSIONS.md
          git add registry/routes.json web/data.json web/geo
          git rm .github/apply-0133.py .github/workflows/apply-0133.yml
          git commit -m "Complete student events from Kide product locations"
          git pull --rebase origin main
          git push
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
