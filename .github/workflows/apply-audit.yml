name: Apply audit fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          echo '' | base64 -d > /tmp/audit.patch
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
          rm .github/workflows/apply-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct malformed times, repeat events, and venue matching [skip ci]" -m "Generated with Codebuff 🤖" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
