name: Apply audit fixes (retry)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected patch
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          wf = pathlib.Path(".github/workflows/apply-audit.yml").read_text(encoding="utf-8")
          b64 = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d", wf).group(1)
          lines = base64.b64decode(b64).decode("utf-8").splitlines(keepends=True)
          fixed = '             # each spells the campus differently ("TAMK C3 Game Studio", "TAMK Games Academy", \u2026)\n'
          for i, line in enumerate(lines):
              if "four clubs selling the same club jam" in line:
                  lines[i] = line.replace("same club jam", "same jam")
              if "TAMK Games Academy" in line:
                  lines[i] = fixed
          pathlib.Path("/tmp/audit.patch").write_text("".join(lines), encoding="utf-8")
          PY
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
          rm .github/workflows/apply-audit.yml .github/workflows/apply-audit-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct malformed times, repeat events, and venue matching [skip ci]" -m "Generated with Codebuff 🤖" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
