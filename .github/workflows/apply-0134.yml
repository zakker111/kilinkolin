name: Apply 0.13.4 completeness patch

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the tested 0.13.4 source/docs patch
        run: python3 .github/apply-0134.py

      - name: Build the uncapped event set
        run: python3 scripts/build.py --city tampere --mode full

      - name: Fetch walking legs for the new calendar venues
        run: python3 scripts/routes.py --max 1500

      - name: Rebuild with the new geometry
        run: python3 scripts/build.py --city tampere --mode full

      - name: Validate
        run: python3 scripts/validate.py

      - name: Commit 0.13.4 and remove the one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md TODO.md VERSIONS.md \
            scripts/build.py scripts/feeds/city_events.py scripts/feeds/kide.py \
            scripts/feeds/tampere_city.py scripts/validate.py web/config.js \
            registry/routes.json web/data.json web/geo
          git rm .github/apply-0134.py .github/workflows/apply-0134.yml
          git commit -m "Publish all future events and fix after-midnight dates"
          git pull --rebase origin main
          git push

      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
