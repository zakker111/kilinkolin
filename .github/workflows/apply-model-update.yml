name: Apply model update

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_model_update.py"

permissions:
  contents: write

jobs:
  apply:
    name: Apply and commit the model update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the update
        run: python3 scripts/apply_model_update.py

      - name: Commit, remove the one-shot files, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --quiet scripts/apply_model_update.py .github/workflows/apply-model-update.yml
          git commit -m "Event size, district transit corridors, venue-size prior and the version badge"
          git pull --rebase origin main || true
          git push
