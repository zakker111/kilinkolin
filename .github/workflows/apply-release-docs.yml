name: Apply the 0.13.0 documentation release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-docs.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the patch
        run: |
          git apply --check .github/release-docs.patch
          git apply .github/release-docs.patch

      - name: Commit, remove the one-shot files, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --quiet .github/release-docs.patch .github/workflows/apply-release-docs.yml
          git commit -m "Release 0.13.0: refresh all project documentation"
          git pull --rebase origin main || true
          git push
