name: Build Kilinkolin

on:
  schedule:
    - cron: "15 5 * * *"   # daily: pull the latest events and redeploy
    - cron: "0 4 * * 0"    # Sunday: weekly full rebuild, guaranteed weekly refresh
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Force a full model rebuild"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "registry/**"
      - "data/seed_events.json"
      - "web/index.html"
      - "web/app.js"
      - "web/map.js"
      - "web/styles.css"
      - "web/config.js"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kilinkolin-build
  cancel-in-progress: true

jobs:
  build:
    name: Build data and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data
        env:
          DIGITRANSIT_API_KEY: ${{ secrets.DIGITRANSIT_API_KEY }}
        run: python3 scripts/build.py --city tampere --mode full

      # New events bring new origins; fetch their street geometry before deploying so the
      # heat follows roads instead of falling back to straight lines. The first run has no
      # cache yet, so it seeds every venue/zone leg; later runs only fill what is missing.
      - name: Fetch missing street routes
        continue-on-error: true
        run: |
          if [ -s registry/routes.json ]; then
            python3 scripts/routes.py --from-flow --max 300
          else
            python3 scripts/routes.py --max 1400
          fi

      - name: Rebuild with the new routes
        run: python3 scripts/build.py --city tampere --mode full

      - name: Validate (blocks deploy on failure)
        run: python3 scripts/validate.py

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilinkolin-build-${{ github.run_number }}
          path: web/geo/coverage.json
          retention-days: 30

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/geo registry/routes.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: rebuild event data and flow model [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
