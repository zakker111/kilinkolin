name: Build Kilinkolin

on:
  schedule:
    - cron: "0 4 * * 0"    # Sunday: weekly refresh and full rebuild
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Force a full model rebuild"
        type: boolean
        default: true
      allow_data_drop:
        description: "Continue after the data-churn guard reports a reviewed event drop"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "registry/**"
      - "data/seed_events.json"
      - "web/index.html"
      - "web/app.js"
      - "web/map.js"
      - "web/styles.css"
      - "web/config.js"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  issues: write

concurrency:
  group: kilinkolin-build
  cancel-in-progress: true

jobs:
  build:
    name: Build data and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save previous published data
        run: |
          if [ -f web/data.json ]; then
            cp web/data.json "$RUNNER_TEMP/previous-data.json"
          fi
          if [ -f web/geo/flows.json ]; then
            cp web/geo/flows.json "$RUNNER_TEMP/previous-flows.json"
          fi

      - name: Build data
        env:
          DIGITRANSIT_API_KEY: ${{ secrets.DIGITRANSIT_API_KEY }}
        run: python3 scripts/build.py --city tampere --mode full

      # New events bring new origins; fetch their street geometry before deploying so the
      # heat follows roads instead of falling back to straight lines.
      - name: Fetch missing street routes
        continue-on-error: true
        run: |
          cached=$(python3 -c "import json,os;p='registry/routes.json';print(len(json.load(open(p)).get('routes',{})) if os.path.exists(p) else 0)")
          echo "cached legs: $cached"
          # legs the current flows draw, then any missing legs for venues that are new
          # (calendar venues arrive with their own coordinates and need their own routes)
          python3 scripts/routes.py --from-flow --max 300
          # generous ceiling: the whole backlog is fetched in one run rather than trickling in
          # over days, so no published event is left on the straight-line fallback
          python3 scripts/routes.py --max 1500

      - name: Rebuild with the new routes
        run: python3 scripts/build.py --city tampere --mode full

      # A route-fetch outage must not deploy a map that silently uses straight lines.
      - name: Check route coverage
        run: |
          python3 scripts/check_route_coverage.py \
            --flows web/geo/flows.json \
            --routes web/geo/routes.json \
            --previous "$RUNNER_TEMP/previous-flows.json"

      # Compare against the data that was live before this build. Expired events
      # are excluded by the checker; a partial feed must not silently remove events.
      - name: Check data churn
        run: |
          if [ "${{ inputs.allow_data_drop }}" = "true" ]; then
            python3 scripts/check_data_churn.py \
              --previous "$RUNNER_TEMP/previous-data.json" \
              --current web/data.json \
              --allow-drop
          else
            python3 scripts/check_data_churn.py \
              --previous "$RUNNER_TEMP/previous-data.json" \
              --current web/data.json
          fi

      - name: Validate (blocks deploy on failure)
        run: python3 scripts/validate.py

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilinkolin-build-${{ github.run_number }}
          path: web/geo/coverage.json
          retention-days: 30

      - name: Install smoke-test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium for smoke test
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          # Keep a month of artifacts so a failed live check can redeploy the
          # previous successful build, including across the weekly schedule.
          retention-days: 30

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # This is deliberately separate from the local smoke suite: it verifies
      # the actual Pages origin, subpath, deployed data and JS/CSS.
      - name: Smoke-test live Pages
        id: live_smoke
        continue-on-error: true
        working-directory: tests
        env:
          LIVE_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: npm run test:live

      - name: Find previous successful Pages build
        id: last_good
        if: steps.live_smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              branch: "main",
              status: "success",
              per_page: 50,
            });
            const previous = runs.data.workflow_runs.find(
              (run) => run.id !== context.runId && run.run_number < context.runNumber
            );
            if (!previous) {
              core.setFailed("Live smoke failed and no previous successful build is available for rollback.");
              return;
            }
            core.setOutput("run_id", previous.id);
            core.setOutput("run_url", previous.html_url);
            core.info(`Rollback source: ${previous.html_url}`);

      - name: Download previous Pages artifact
        if: steps.live_smoke.outcome == 'failure' && steps.last_good.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/rollback-pages
          run-id: ${{ steps.last_good.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare previous Pages artifact
        if: steps.live_smoke.outcome == 'failure' && steps.last_good.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-rollback
          path: ${{ runner.temp }}/rollback-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1

      - name: Deploy previous Pages artifact
        id: rollback
        if: steps.live_smoke.outcome == 'failure' && steps.last_good.outputs.run_id != ''
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback

      - name: Fail after live smoke
        if: always() && steps.live_smoke.outcome == 'failure'
        run: |
          echo "Live Pages smoke test failed."
          echo "Rollback outcome: ${{ steps.rollback.outcome }}"
          if [ "${{ steps.rollback.outcome }}" = "success" ]; then
            echo "The previous successful Pages deployment was restored."
          fi
          exit 1

      # Commit only after the deployed site has passed its live check. If the
      # check fails, the previous artifact is restored and no new data is committed.
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/geo
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: rebuild event data and flow model [skip ci]"
          fi
          if [ -f registry/routes.json ]; then
            git add registry/routes.json
            git diff --cached --quiet || git commit -m "chore: refresh street route cache [skip ci]"
          fi
          git pull --rebase origin main || true
          git push

  notify-failure:
    name: Report build failure
    needs: [build]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "CI failure: Build Kilinkolin";
            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 5 });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The **Build Kilinkolin** workflow did not complete successfully.",
              "",
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Ref: \`${context.ref}\``,
              `- Event: \`${context.eventName}\``,
              "",
              "This issue is updated automatically by the workflow; close it after triage.",
            ].join("\n");
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: found.data.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

  close-recovered-issue:
    name: Close recovered failure issue
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Close an open failure issue after a successful build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "CI failure: Build Kilinkolin";
            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 20 });
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            for (const issue of found.data.items) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Build recovered successfully in ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
