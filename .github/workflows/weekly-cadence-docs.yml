name: Apply weekly cadence docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update docs and config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"missing old text in {path}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          edit("web/config.js", 'APP_VERSION: "0.13.5"', 'APP_VERSION: "0.13.6"')
          edit("README.md", "**v0.13.5**", "**v0.13.6**")
          edit(
              "README.md",
              "The workflow syncs events daily at 05:15 UTC, does a guaranteed full rebuild on Sundays at\n04:00 UTC, retries on Sunday at 06:00 UTC, and runs on pushes. `validate.py` and the Playwright\nsmoke suite block deployment, so a failed build leaves the last good site up.",
              "The workflow refreshes events once a week, on Sundays at 04:00 UTC, and also runs on pushes\nthat change the build. `validate.py` and the Playwright smoke suite block deployment, so a\nfailed build leaves the last good site up.",
          )
          edit(
              "AGENTS.md",
              "The workflow refreshes every day at 05:15 UTC and does a guaranteed full rebuild on Sundays at\n04:00 UTC: new events are fetched, their missing street routes are added, the model is rebuilt,\nvalidated and deployed to Pages.",
              "The workflow refreshes once a week, on Sundays at 04:00 UTC: new events are fetched, their\nmissing street routes are added, the model is rebuilt, validated and deployed to Pages. It also\nruns on pushes that change the build.",
          )
          edit("TODO.md", "daily sync, weekly rebuild", "weekly sync and rebuild")
          edit(
              "TODO.md",
              "- [x] Sunday retry cron (`0 6 * * 0`) after the weekly 04:00 rebuild",
              "- [x] 0.13.6 weekly-only refresh: one Sunday 04:00 UTC scheduled run; the daily 05:15 UTC sync\n      and Sunday 06:00 UTC retry were removed",
          )

          p = Path("VERSIONS.md")
          s = p.read_text(encoding="utf-8")
          marker = "## App\n\n### 0.13.5 — 2026-11-16"
          if marker not in s:
              raise SystemExit("missing VERSIONS marker")
          section = (
              "## App\n\n"
              "### 0.13.6 — 2026-11-16\n"
              "Run the scheduled refresh once a week.\n\n"
              "- Changed: the scheduled build now runs only on Sundays at 04:00 UTC. The daily 05:15 UTC sync\n"
              "  and the Sunday 06:00 UTC retry were removed, so a successful week no longer rebuilds twice.\n"
              "- Kept: pushes that change the build and manual `workflow_dispatch` runs still rebuild and deploy.\n"
              "- No data, model or schema change: model 2026.11.6, schema 2.\n\n"
              "### 0.13.5 — 2026-11-16"
          )
          p.write_text(s.replace(marker, section, 1), encoding="utf-8")
          PY
          rm .github/workflows/weekly-cadence.yml .github/workflows/weekly-cadence-docs.yml
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: document weekly-only refresh [skip ci]" -m "Generated with Codebuff 🤖" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
