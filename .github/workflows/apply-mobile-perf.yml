name: Apply mobile performance update

on:
  push:
    branches: [main]
    paths:
      - ".github/mobile-perf.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the patch
        run: |
          git apply --check .github/mobile-perf.patch
          git apply .github/mobile-perf.patch

      - name: Commit, remove the one-shot files, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --quiet .github/mobile-perf.patch .github/workflows/apply-mobile-perf.yml
          git commit -m "Optimise mobile layout and payload, add mobile detection"
          git pull --rebase origin main || true
          git push
