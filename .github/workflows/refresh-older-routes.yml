name: Refresh older venue routes

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drop older stale route cache entries
        run: python3 .github/refresh-older-routes.py
      - name: Build with the refresh
        run: python3 scripts/build.py --city tampere --mode full
      - name: Fetch the event-used legs
        run: python3 scripts/routes.py --from-flow --max 500
      - name: Rebuild with the new geometry
        run: python3 scripts/build.py --city tampere --mode full
      - name: Validate
        run: python3 scripts/validate.py
      - name: Commit and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSIONS.md TODO.md registry/routes.json web/data.json web/geo
          git rm .github/refresh-older-routes.py .github/workflows/refresh-older-routes.yml
          git commit -m "Refresh route geometry for earlier venue corrections"
          git push
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
