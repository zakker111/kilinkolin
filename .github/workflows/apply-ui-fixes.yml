name: Apply the 0.13.1 UI fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/ui-fixes.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the patch
        run: |
          git apply --check .github/ui-fixes.patch
          git apply .github/ui-fixes.patch

      - name: Commit, remove the one-shot files, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --quiet .github/ui-fixes.patch .github/workflows/apply-ui-fixes.yml
          git commit -m "Release 0.13.1: fix next-day label and duplicate legend"
          git pull --rebase origin main || true
          git push
