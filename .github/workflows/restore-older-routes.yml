name: Restore older venue routes

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the missing venue legs
        run: python3 scripts/routes.py --max 400
      - name: Rebuild with the restored geometry
        run: python3 scripts/build.py --city tampere --mode full
      - name: Validate
        run: python3 scripts/validate.py
      - name: Commit the restored geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/routes.json
          git rm .github/workflows/restore-older-routes.yml
          git commit -m "Restore route geometry for earlier venue corrections"
          git pull --rebase origin main
          git push
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
